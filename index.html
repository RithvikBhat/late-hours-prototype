<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Hours prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: a shipped quick-commerce app at 1 AM: calm, exact, warm.
IDEA: the Instamart app on a phone, switching itself into its night store.
PICTURE: the phone itself, full height, with a small control rail for time of night.
COLOUR and TYPE: Instamart blue on blue-black surfaces, fluoro for perks only; Urbanist as the stand-in for Gilroy.
LAYOUT: phone centred, scenario rail beside it on wide screens, above it on narrow ones.
*/
:root{
  --page:#0D1019;--card:#161A25;--raised:#20253A;--hair:#2A2F42;--text:#E7E9EF;--meta:#9A9DA6;--link:#52A8FE;
  --fill:#0050FF;--pressed:#0046E0;--success:#2BC48A;--successBg:#132A23;--warn:#F5B544;--warnBg:#2E2616;
  --danger:#F26D6D;--dangerBg:#2B1A20;--fluo:#A4FFFD;
  --d-page:#F0F0F5;--d-text:#414449;--d-meta:#8D8F91;--d-promise:#002E98;--d-tile:#E3EAF8;--d-strip:#E3F6F1;
  --out:cubic-bezier(.23,1,.32,1);--inout:cubic-bezier(.77,0,.175,1);--drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#05070C;color:var(--text);font:15px/1.4 Urbanist,'Gilroy',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px}
/* ---------- side panel ---------- */
.panel{width:280px;display:flex;flex-direction:column;gap:18px}
.panel h1{font-size:28px;line-height:1.1;margin:0;font-weight:700}
.panel p{margin:0;color:var(--meta);font-size:14px}
.scen{display:grid;gap:8px}
.scen button{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:#11151F;border:1px solid var(--hair);transition:background-color .15s ease,border-color .15s ease,transform .16s var(--out)}
.scen button:active{transform:scale(.97)}
.scen button b{font-weight:700;font-size:15px}.scen button span{color:var(--meta);font-size:13px}
.scen button[aria-pressed=true]{background:var(--raised);border-color:var(--link)}
.try{margin:0;padding-left:18px;color:var(--meta);font-size:13px;display:grid;gap:4px}
.small{font-size:12px;color:#6F7380}
.ghostbtn{padding:10px 14px;border-radius:10px;border:1px solid var(--hair);font-weight:600;font-size:14px;transition:transform .16s var(--out)}
.ghostbtn:active{transform:scale(.97)}
.ghostbtn[hidden]{display:none}
/* ---------- phone ---------- */
.phonebox{flex:none;width:calc(390px * var(--k,1));height:calc(844px * var(--k,1))}
.phone{position:relative;width:390px;height:844px;transform:scale(var(--k,1));transform-origin:0 0;border-radius:48px;padding:10px;background:#1B1E27;box-shadow:0 0 0 1px #2A2E3A,0 30px 80px rgba(0,0,0,.6)}
.screen{container-type:size;position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--page);isolation:isolate}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page);will-change:transform,opacity}
.view[hidden]{display:none}
.status{height:56px;flex:none;display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;padding:2px 8px 0;font-family:-apple-system,'SF Pro Text','SF Pro Display',system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.3px;line-height:1;position:relative;z-index:5}
.status>.clock{justify-self:center;grid-column:1}
.status i{justify-self:center;grid-column:3;display:flex;gap:6px;align-items:center;font-style:normal}
.status i svg{display:block;fill:currentColor}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.9;z-index:60;pointer-events:none}
.scroll-y{overflow-y:auto;scrollbar-width:none}.scroll-y::-webkit-scrollbar{display:none}
.press{transition:transform .16s var(--out)}
.press:active{transform:scale(.97)}
/* ---------- day home ---------- */
#day{background:var(--d-page);color:var(--d-text)}
#day .top{background:linear-gradient(#D6E2FF,#F0F0F5 380px)}
.d-eta{font-size:30px;font-weight:800;color:var(--d-promise);line-height:1}
.d-addr{display:flex;align-items:center;gap:4px;color:var(--d-promise);font-size:14px;margin-top:6px}
.d-addr b{font-weight:700}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 16px 0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.d-search{display:flex;gap:10px;padding:16px 16px 0}
.d-search .bar{flex:1;height:52px;border-radius:12px;background:#fff;border:1px solid #C9D3E8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--d-meta);font-weight:500}
.d-search .bm{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--d-promise);display:grid;place-items:center;color:var(--d-promise)}
.banner{margin:16px 16px 0;height:150px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0D1019,#1E2850);color:#fff;text-align:left;width:calc(100% - 32px);display:block}
.banner .bt{position:absolute;left:16px;top:16px;font-size:11px;font-weight:700;color:var(--fluo);background:rgba(255,255,255,.12);border-radius:99px;padding:4px 9px;letter-spacing:.2px}
.banner h3{position:absolute;left:16px;top:44px;margin:0;font-size:22px;font-weight:700}
.banner p{max-width:78%;position:absolute;left:16px;top:74px;margin:0;font-size:13px;color:#B8BED0;font-weight:500}
.banner .cta{z-index:2;position:absolute;left:16px;bottom:14px;background:#fff;color:var(--d-promise);font-weight:700;font-size:13px;border-radius:99px;padding:8px 14px;display:flex;gap:6px;align-items:center;transition:background-color .2s ease}
.banner .cta.set{background:var(--d-strip);color:#0C6B47}
.banner svg.city{position:absolute;right:0;bottom:0}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:18px 16px 0}
.tiles div{text-align:center;font-size:12px;font-weight:600}
.tiles i{display:grid;place-items:center;height:60px;border-radius:12px;background:var(--d-tile);margin-bottom:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 10px}
.sec b{font-size:18px;font-weight:700}.sec a{color:var(--d-fill,#0050FF);font-weight:700;font-size:13px;color:#0050FF}
.best{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.best>div{background:#fff;border-radius:12px;padding:6px 6px 10px;position:relative}
.best .im{height:72px;border-radius:8px;background:#F3F5FA;display:grid;place-items:center}
.best .dadd{position:absolute;right:8px;top:58px;border:1px solid #0050FF;color:#0050FF;background:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:4px 10px}
.best b{display:block;font-size:13px;margin:12px 2px 0;}
.best small{display:block;color:var(--d-meta);font-size:12px;margin:0 2px}
.best em{font-style:normal;font-weight:700;font-size:14px;margin:4px 2px 0;display:block}
.strip{flex:none;background:var(--d-strip);text-align:center;font-weight:600;font-size:13px;padding:9px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #E3E5EA;padding:10px 0 28px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--d-meta);font-weight:500}
.tabs button.on{color:var(--d-text);font-weight:700}
.dim{position:absolute;inset:0;background:radial-gradient(120% 80% at 70% 20%,#1E2850 0%,#0D1019 60%);opacity:0;pointer-events:none;z-index:40}
/* ---------- night shared ---------- */
.nhdr{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 16px 0}
.neta{display:flex;align-items:center;gap:10px}
.neta strong{white-space:nowrap;font-size:28px;font-weight:700;color:var(--link);line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--raised);color:var(--meta);font-size:12px;font-weight:700;white-space:nowrap}
.pill.warn{background:var(--warnBg);color:var(--warn)}
.naddr{display:flex;align-items:center;gap:4px;font-size:14px;margin-top:6px}
.naddr b{font-weight:700}
.hbtns{display:flex;gap:8px}
.cbtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.cbtn.r{background:var(--raised);font-weight:700}
/* night home */
.bento{margin:14px 16px 0;height:150px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0D1019,#1E2850);flex:none}
.bento h2{position:absolute;left:16px;top:16px;margin:0;font-size:22px;font-weight:700;color:#fff}
.bento svg.city{position:absolute;right:0;bottom:0}
.bento p{max-width:60%;position:absolute;left:16px;top:46px;margin:0;font-size:14px;color:#B8BED0}
.q{font-size:18px;font-weight:600;margin:22px 16px 12px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.ctile{position:relative;height:116px;border-radius:16px;background:var(--card);border:1px solid var(--hair);overflow:hidden;text-align:left;transition:transform .16s var(--out),background-color .15s ease}
.ctile:active{transform:scale(.97)}
.ctile .disc{position:absolute;right:-14px;top:-14px;width:96px;height:96px;border-radius:50%;background:var(--raised);opacity:.75}
.ctile .art{position:absolute;right:10px;top:6px;width:64px;height:64px}
.ctile b{position:absolute;left:16px;bottom:30px;right:12px;font-size:16px;font-weight:700;display:flex;gap:6px;align-items:center}
.ctile small{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--meta);font-weight:500;right:12px}
.nsearch{transition:margin-bottom .35s var(--out);margin:12px 16px 30px;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--meta);font-weight:500;flex:none;width:calc(100% - 32px);text-align:left}
/* ---------- store ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none;flex:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--hair);color:var(--meta);font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .16s var(--out)}
.chip:active{transform:scale(.97)}
.chip .cic{display:inline-grid;color:var(--meta);transition:color .15s ease}
.chip.on .cic{color:var(--link)}
.chip.on{background:var(--raised);border-color:var(--link);color:var(--text);font-weight:600}
.herozone{flex:1;padding:12px 16px 0;display:flex;min-height:0;position:relative}
.catload{position:absolute;inset:12px 16px 0;border-radius:16px;background:var(--card);z-index:4;display:grid;place-content:center;justify-items:center;text-align:center}
.catload .ring{position:relative;width:112px;height:112px;display:grid;place-items:center}
.catload .ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.catload .ring .disc{width:92px;height:92px;border-radius:50%;background:var(--raised);display:grid;place-items:center;color:var(--link)}
.catload h3{margin:18px 0 4px;font-size:22px;font-weight:700}
.catload p{margin:0;color:var(--meta);font-size:14px}
.catload small{display:block;margin-top:14px;color:var(--meta);font-size:12px;letter-spacing:.2px}
.hero{flex:1;position:relative;border-radius:16px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none}
.hin{position:absolute;inset:0;display:flex;flex-direction:column}
.himg{flex:1;min-height:150px;position:relative;background:linear-gradient(#262C44,#161A25);display:grid;place-items:center}
.himg .art{width:132px;height:132px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
.himg .tag{position:absolute;left:16px;top:16px}
.himg .badge{position:absolute;right:16px;top:16px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:rgba(13,16,25,.6);color:var(--fluo);font-weight:700;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--raised);color:var(--meta);font-weight:700;font-size:12px;white-space:nowrap}
.badge.ok{background:var(--successBg);color:var(--success)}.badge.bad{background:var(--dangerBg);color:var(--danger)}.badge.warn{background:var(--warnBg);color:var(--warn)}
.info{margin:0 12px;border-radius:12px;background:var(--raised);padding:14px 16px;flex:none}
.info a,.lnk{color:var(--link);font-weight:700;font-size:13px;text-decoration:none}
.info h2{margin:4px 0 2px;font-size:18px;font-weight:600;}
.info p{margin:0;color:var(--meta);font-size:14px;}
.info .q2{margin-top:10px;color:var(--meta);font-size:13px;font-weight:500}
.buy{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 14px;border-top:1px solid var(--hair);margin-top:12px;flex:none}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--meta)}
.meta i{width:1px;height:12px;background:var(--hair)}
.off{color:var(--success);font-weight:700;font-style:normal}
.price{display:flex;gap:6px;align-items:baseline;margin-top:2px}
.price b{font-size:20px;font-weight:700}.price s{color:var(--meta);font-size:14px}
.soldout .info h2,.soldout .price b,.soldout .off{color:var(--meta)}
.soldout .himg .art{opacity:.35;filter:grayscale(.4)}
/* stepper */
.stp{position:relative;width:124px;height:44px;flex:none}
.stp>*{position:absolute;inset:0}
.add,.qty{border-radius:6px;background:var(--fill);color:#fff;font-weight:700;font-size:16px;transition:transform .16s var(--out),background-color .1s ease}
.add:active{transform:scale(.97);background:var(--pressed)}
.qty{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.qty button{width:40px;height:40px;display:grid;place-items:center;border-radius:6px;transition:transform .16s var(--out),opacity .2s ease}
.qty button:active{transform:scale(.9)}
.qty button[disabled]{opacity:.3;cursor:default}
.num{position:relative;width:28px;height:22px;overflow:hidden;text-align:center}
.num span{position:absolute;inset:0;line-height:22px}
.soldpill{border-radius:6px;border:1px solid var(--hair);color:var(--meta);font-weight:600;font-size:14px;display:grid;place-items:center}
.stp.sm .soldpill{font-size:12px;border-radius:8px}
.notify{border-radius:6px;border:1px solid var(--link);color:var(--link);font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center;transition:transform .16s var(--out),background-color .2s ease}
.notify:active{transform:scale(.97)}
.notify.on{border-color:var(--hair);color:var(--meta)}
.stp.sm{width:76px;height:32px}
.stp.sm .add{background:var(--card);border:1px solid var(--link);color:var(--link);font-size:14px;border-radius:8px}
.stp.sm .qty{background:var(--card);border:1px solid var(--hair);color:var(--link);border-radius:8px;font-size:14px;padding:0}
.stp.sm .qty button{width:26px;height:30px}
/* rail */
.railwrap{position:relative;flex:none;height:112px;margin-top:4px}
.rail{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;padding-top:18px;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.th{flex:none;width:68px;height:80px;scroll-snap-align:center;display:grid;justify-items:center;align-content:start;position:relative}
.th .d{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;transform-origin:50% 50%;will-change:transform,opacity;position:relative}
.th .d::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--link);opacity:0;transition:opacity .15s ease}
.th.sel .d{background:var(--raised)}
.th.sel .d::after{opacity:1}
.th .d svg{width:44px;height:44px}
.th.out .d svg{opacity:.35}
.th.next .d{background:transparent;border:1px dashed var(--hair);font-size:11px;color:var(--meta);font-weight:700;text-align:center;line-height:1.15;padding:6px}
.cbspace{height:28px;transition:height .35s var(--out)}
#store.hascart .cbspace{height:112px}
#nhome.hascart .nsearch{margin-bottom:104px}
#search.hascart .slist{padding-bottom:120px}
.hint{text-align:center;color:var(--meta);font-size:13px;font-weight:500;height:20px;flex:none;transition:opacity .3s ease}
/* cart bar */
/* cart bar: LH tokens. radius lg 16, spacing 4/8/12/16, type ramp Body small strong 14/20, Button 16/20, Caption 12/16 */
.cartbar{position:absolute;left:12px;right:12px;bottom:26px;min-height:64px;border-radius:16px;background:var(--fill);display:flex;align-items:center;gap:12px;padding:8px 12px 16px 16px;z-index:37;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .35s var(--out),visibility 0s .35s;text-align:left;box-shadow:0 8px 24px rgba(0,40,160,.3)}
.cartbar.show{transform:translateY(0);visibility:visible;transition:transform .35s var(--out),visibility 0s}
.cartbar:active{transform:scale(.98)}
.cbmsg{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600;color:#fff}
.cbmsg em{font-style:normal;font-weight:700;color:var(--fluo)}
.cbr{text-align:right;flex:none}
.cbr b{display:block;font-size:16px;line-height:20px;font-weight:700}
.cbr small{display:block;font-size:12px;line-height:16px;font-weight:500;color:rgba(255,255,255,.8)}
.thumbs{position:relative;flex:none;width:44px;height:40px}
.thumbs span{position:absolute;top:0;right:0;width:40px;height:40px;border-radius:8px;background:#fff;display:grid;place-items:center}
.thumbs span:nth-last-child(2){right:4px;top:0;transform:scale(.92);opacity:.85}
.thumbs svg{width:30px;height:30px}
.cbchev{flex:none;display:grid;place-items:center;margin-left:-4px;opacity:.9}
.track{position:absolute;left:16px;right:16px;bottom:8px;height:3px;border-radius:999px;background:rgba(255,255,255,.22)}
.track i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:linear-gradient(90deg,rgba(164,255,253,.4),#A4FFFD);transform-origin:left;transition:transform .45s var(--out)}
.track b{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(164,255,253,.8);transition:left .45s var(--out)}
.track.ok i{background:#fff}.track.ok b{display:none}
/* skeleton */
.sk{position:absolute;inset:0;z-index:5;background:var(--page);display:flex;flex-direction:column;padding:12px 16px 0;transition:opacity .25s ease}
.sk div{background:var(--card);border-radius:12px;position:relative;overflow:hidden}
.sk div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:translateX(-100%);animation:shimmer 1.1s linear infinite}
.sk[hidden]{display:none}
@keyframes shimmer{to{transform:translateX(100%)}}
/* closed overlay */
.closedov{position:absolute;inset:0;z-index:30;background:rgba(13,16,25,.86);display:grid;place-items:center;text-align:center;padding:24px;opacity:0;transition:opacity .3s ease;pointer-events:none}
.closedov.show{opacity:1;pointer-events:auto}
.closedov h3{margin:12px 0 4px;font-size:22px}.closedov p{margin:0 0 16px;color:var(--meta)}
/* detail */
#detail{z-index:25;background:var(--page);will-change:clip-path,transform}
.dimg{height:300px;flex:none;position:relative;background:linear-gradient(#262C44,#0D1019);display:grid;place-items:center;touch-action:none}
.dimg .art{width:160px;height:160px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.4))}
.grab{position:absolute;top:64px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.25)}
.dclose{position:absolute;left:16px;top:74px;width:40px;height:40px;border-radius:50%;background:rgba(13,16,25,.6);display:grid;place-items:center}
.dimg .tag{position:absolute;right:16px;top:82px}
.dbody{flex:1;padding:0 16px 170px;overflow-y:auto;scrollbar-width:none}
.dbody::-webkit-scrollbar{display:none}
.dcard{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
.dcard h2{margin:4px 0 2px;font-size:20px;font-weight:600}
.dcard p{margin:0;color:var(--meta);font-size:14px}
.qline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--meta);font-size:13px;font-weight:500}
.prom{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.prom div+div{border-left:1px solid var(--hair)}
.prom b{display:block;font-size:15px}.prom small{color:var(--meta);font-size:13px}
.seg{position:relative;display:inline-flex;gap:8px;margin-bottom:10px}
.seg button{height:32px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--meta);position:relative;z-index:1;transition:color .2s ease}
.seg button.on{color:var(--page)}
.seg .ind{position:absolute;top:0;left:0;height:32px;border-radius:99px;background:var(--text);transition:transform .25s var(--inout),width .25s var(--inout)}
.rows div{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.rows div+div{border-top:1px solid var(--hair)}
.rows span{color:var(--meta)}
.dbar{z-index:3;position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:var(--card);border-top:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
.dpill{z-index:4;position:absolute;left:50%;bottom:112px;transform:translate(-50%,24px);opacity:0;height:44px;padding:0 14px 0 18px;border-radius:99px;background:var(--fill);display:flex;align-items:center;gap:10px;transition:transform .3s var(--out),opacity .2s ease;pointer-events:none}
.dpill.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.dpill b{display:block;font-size:13px;text-align:left}.dpill small{font-size:12px}
/* checkout */
#checkout{z-index:26}
.cohdr{display:flex;align-items:center;gap:10px;padding:6px 12px 10px}
.cohdr .bk{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.cohdr b{font-weight:700;display:flex;gap:4px;align-items:center}
.cohdr small{display:block;color:var(--meta);font-size:13px;}
.cobody{flex:1;overflow-y:auto;padding:0 16px 190px;scrollbar-width:none}
.cobody::-webkit-scrollbar{display:none}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.boxh{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.boxh b{font-size:18px}.boxh .cnt{margin-left:auto;color:var(--meta);font-size:13px;font-weight:500}
.lh{display:inline-flex;gap:5px;align-items:center;height:24px;padding:0 9px;border-radius:99px;background:var(--raised);font-size:12px;font-weight:700}
.row{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--out),opacity .2s ease}
.row.gone{grid-template-rows:0fr;opacity:0}
.row>div{overflow:hidden}
.ri{display:flex;gap:12px;padding:10px 0;align-items:flex-start;border-radius:12px;transition:background-color .3s ease,padding .3s var(--out)}
.ri .im{width:56px;height:56px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none;transition:opacity .3s ease}
.ri .im svg{width:44px;height:44px}
.ri .tx{flex:1;min-width:0}
.ri .tx b{display:block;font-weight:500;font-size:15px;}
.ri .tx small{color:var(--meta);font-size:13px}
.ri .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ri .pr{display:flex;gap:6px;align-items:baseline;font-size:15px;font-weight:700}.ri .pr s{font-size:13px;color:var(--meta);font-weight:400}
.ri.sold{background:var(--dangerBg);padding:10px 10px}
.ri.sold .im{opacity:.5}
.ri .st{display:flex;gap:5px;align-items:center;color:var(--danger);font-size:13px;font-weight:600;margin-top:4px}
.rmv{color:var(--danger);font-weight:700;font-size:14px;padding:6px 0 6px 10px}
.sug{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--out)}
.sug.show{grid-template-rows:1fr}
.sug>div{overflow:hidden}
.sugin{margin:10px 0 4px;background:var(--raised);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sugin small{display:block;color:var(--meta);font-size:12px}.sugin b{font-weight:500;font-size:14px}
.swap{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--link);color:var(--link);font-weight:700;font-size:13px;transition:transform .16s var(--out)}
.swap:active{transform:scale(.97)}
.bill div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--meta);font-weight:500}
.bill div b{color:var(--text);font-weight:500}
.bill .note{padding:0 0 6px;color:var(--success);font-size:12px}
.bill .tot{border-top:1px solid var(--hair);margin-top:6px;padding-top:12px;color:var(--text);font-weight:700;font-size:15px}
.bill .tot b{font-weight:700}
.free{color:var(--success)!important;font-weight:700!important}
.paysheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:12px 16px 30px;z-index:3}
.payrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.payrow .lg{width:40px;height:40px;border-radius:12px;background:var(--raised);display:grid;place-items:center}
.payrow .lg i{width:20px;height:20px;border-radius:50%;background:#5F259F}
.payrow small{display:block;color:var(--meta);font-size:13px}.payrow b{font-weight:600}
.payrow a{margin-left:auto;color:var(--link);font-weight:700;font-size:14px}
.slide.off{background:var(--raised);color:var(--meta);font-size:14px}
.slide{position:relative;height:56px;border-radius:99px;background:var(--fill);overflow:hidden;touch-action:none;user-select:none}
.slide .fillbar{position:absolute;inset:0;background:var(--pressed);transform-origin:left;transform:scaleX(0)}
.slide .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-weight:700;font-size:16px;padding-left:40px}
.knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--fill);display:grid;place-items:center;cursor:grab;will-change:transform}
.knob:active{cursor:grabbing}
.closingnote{display:flex;gap:8px;align-items:center;background:var(--warnBg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.empty{text-align:center;padding:80px 24px}
.empty h3{margin:14px 0 4px;font-size:20px}.empty p{color:var(--meta);margin:0 0 18px}
.btn{height:48px;padding:0 22px;border-radius:6px;background:var(--fill);color:#fff;font-weight:700;font-size:16px;transition:transform .16s var(--out),background-color .1s ease}
.btn:active{transform:scale(.97);background:var(--pressed)}
/* placed */
#placed{z-index:27;align-items:stretch}
.mark{width:88px;height:88px;border-radius:50%;background:var(--successBg);display:grid;place-items:center;margin:60px auto 0}
.mark path{stroke-dasharray:30;stroke-dashoffset:30}
#placed h2{text-align:center;font-size:28px;margin:22px 0 4px}
.eta2{text-align:center;color:var(--link);font-size:20px;font-weight:600}
.sub2{text-align:center;color:var(--meta);margin:4px 0 10px}
.saved{display:flex;justify-content:center}
.prog{margin:22px 16px 0;padding:16px;background:var(--card);border-radius:16px}
.steps{position:relative;display:flex;justify-content:space-between;font-size:13px;color:var(--meta);font-weight:500;padding-top:22px}
.steps .ln{position:absolute;left:6px;right:6px;top:5px;height:2px;background:var(--hair)}
.steps .ln i{position:absolute;inset:0;background:var(--success);transform-origin:left;transform:scaleX(0);transition:transform .8s var(--inout)}
.steps .dt{position:absolute;top:0;width:12px;height:12px;border-radius:50%;background:var(--raised);border:1px solid var(--hair);transition:background-color .3s ease,border-color .3s ease}
.steps .dt.on{background:var(--success);border-color:var(--success)}
.steps span.on{color:var(--text);font-weight:600}
.sum{margin:12px 16px 0;padding:16px;background:var(--card);border-radius:16px}
.sum .ims{display:flex;gap:8px;margin-top:10px}
.sum .ims span{width:48px;height:48px;border-radius:12px;background:var(--raised);display:grid;place-items:center}
.sum .ims svg{width:38px;height:38px}
/* search sheet */
#search{z-index:35;background:transparent}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;top:52px;background:var(--page);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .45s var(--drawer);display:flex;flex-direction:column}
#search.open .scrim{opacity:1}#search.open .sheet{transform:translateY(0)}
.sin{display:flex;gap:10px;padding:18px 16px 10px;align-items:center}
.sin label{flex:1;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;gap:10px;padding:0 14px}
.sin input{flex:1;background:none;border:0;color:var(--text);font:500 16px Urbanist,system-ui,sans-serif;outline:none}
.sin button{color:var(--link);font-weight:700}
.slist{flex:1;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.slist::-webkit-scrollbar{display:none}
.shead{color:var(--meta);font-size:13px;font-weight:600;margin:12px 0 8px}
.pop{display:flex;flex-wrap:wrap;gap:8px}
.sr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.sr .im{width:48px;height:48px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none}
.sr .im svg{width:38px;height:38px}
.sr .tx{flex:1;min-width:0}.sr b{display:block;font-weight:500;}.sr small{color:var(--meta);font-size:13px}
.na{padding:14px;border-radius:12px;background:var(--card);color:var(--meta);font-size:14px;margin-top:8px}
.na b{color:var(--text)}
/* a few hours later */
#skip{z-index:39;background:radial-gradient(120% 70% at 70% 15%,#1E2850 0%,#0D1019 60%);align-items:center;justify-content:center;text-align:center}
#skip small{color:var(--meta);font-size:14px;font-weight:600;letter-spacing:.3px}
#skip .big{font-size:56px;font-weight:700;line-height:1.1;margin-top:6px;height:62px;position:relative;width:260px}
#skip .big span{position:absolute;inset:0}
#skip p{margin:10px 0 0;color:var(--warn);font-size:15px;font-weight:600;opacity:0}
/* dusk: day to night */
#dusk{z-index:41;overflow:hidden}
#dusk .sky{position:absolute;inset:0;opacity:0}
#dusk .sun{position:absolute;left:50%;top:34%;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:radial-gradient(circle,#FFE7A8 0%,#FFC86B 55%,rgba(255,200,107,0) 72%);box-shadow:0 0 70px 26px rgba(255,190,120,.4)}
#dusk .moon{position:absolute;left:62%;top:20%;color:var(--fluo);filter:drop-shadow(0 0 18px rgba(164,255,253,.45));opacity:0}
#dusk .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 6px rgba(255,255,255,.7)}
#dusk .city{position:absolute;left:0;bottom:0;width:100%;height:100%}
#dusk .w{opacity:0}
#dusk .dlabel{position:absolute;left:0;right:0;top:46%;text-align:center;color:#fff;opacity:0}
#dusk .dlabel b{display:block;font-size:40px;font-weight:700;line-height:1}
#dusk .dlabel span{display:block;margin-top:8px;font-size:16px;font-weight:600;color:var(--fluo)}
/* sunrise */
#dawn{z-index:39;overflow:hidden}
#dawn .sky{position:absolute;inset:0;opacity:0}
#dawn .sky:first-child{opacity:1}
#dawn .moon{position:absolute;left:50%;top:32%;margin-left:-24px;color:var(--fluo)}
#dawn .sun{position:absolute;left:50%;top:40%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,#FFE7A8 0%,#FFC86B 55%,rgba(255,200,107,0) 72%);box-shadow:0 0 80px 30px rgba(255,200,120,.45)}
#dawn .dlabel{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
#dawn .dlabel b{display:block;font-size:40px;font-weight:700;line-height:1}
#dawn .dlabel span{display:block;margin-top:8px;font-size:15px;font-weight:600}
/* closed at 4 AM */
#closedv{z-index:38;background:radial-gradient(120% 70% at 70% 15%,#1E2850 0%,#0D1019 60%);align-items:center;justify-content:center;text-align:center;padding:0 28px}
#closedv h2{margin:18px 0 6px;font-size:26px;font-weight:700;line-height:1.15}
#closedv p{margin:0;color:var(--meta);font-size:15px}
#closedv .cbtns{display:grid;gap:10px;width:100%;margin-top:28px}
#closedv .ghost{height:48px;border-radius:6px;border:1px solid var(--hair);font-weight:700;transition:transform .16s var(--out)}
#closedv .ghost:active{transform:scale(.97)}
#closedv .bar{width:120px;height:3px;border-radius:2px;background:var(--hair);margin:26px auto 0;overflow:hidden}
#closedv .bar i{display:block;height:100%;background:var(--fluo);transform-origin:left;transform:scaleX(0)}
#closedv small{display:block;margin-top:8px;color:var(--meta);font-size:12px}
/* toast */
#screen:has(#checkout:not([hidden])) .toasts{bottom:200px}
.toasts{position:absolute;left:16px;right:16px;bottom:104px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#2A3048;color:var(--text);font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;gap:8px;align-items:center;transition:transform .3s var(--out),opacity .3s var(--out)}
.toast.enter{opacity:0;transform:translateY(8px) scale(.97)}
.toast.leave{opacity:0;transform:translateY(4px);transition-duration:.18s}
.fade-num{display:inline-block}
/* stacked layout: controls above the phone */
@media (max-width:860px){
  .stage{flex-direction:column;justify-content:flex-start;gap:12px;padding:12px}
  .panel{width:100%;max-width:420px;gap:10px}
  .panel h1{font-size:22px}.panel p,.try,.panel .small{display:none}
  .scen{grid-template-columns:repeat(4,minmax(0,1fr))}.scen button{flex-direction:column;align-items:flex-start;padding:8px 10px;gap:2px}
  .scen button b{font-size:14px;white-space:nowrap}.scen button span{font-size:11px;max-width:100%}
}
/* on a real phone: the prototype fills the screen, the time controls become one slim row */
@media (max-width:500px){
  .stage{padding:0;gap:0;height:100dvh}
  .panel{max-width:none;padding:8px 8px 6px;gap:6px;flex:none}
  .panel>div:first-child{display:none}
  .scen{gap:6px}.scen button{padding:6px 8px;border-radius:10px}.scen button b{font-size:13px}.scen button span{font-size:10px}
  .ghostbtn{padding:6px 10px;font-size:13px}
  .phonebox{width:100%;height:auto;flex:1;min-height:0}
  .phone{width:100%;height:100%;transform:none;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .homebar{display:none}
  .cartbar{bottom:14px}.cbspace{height:16px}#store.hascart .cbspace{height:96px}.dbar{padding-bottom:16px}.paysheet{padding-bottom:16px}.cobody{padding-bottom:170px}.nsearch{margin-bottom:16px}
}
/* short screens: keep the product visible, shrink the supporting parts */
@container (max-height:760px){
  .railwrap{height:90px}.rail{padding-top:8px}.th{width:60px;height:70px}.th .d{width:52px;height:52px}.th .d svg{width:38px;height:38px}
  .hint{display:none}
  .himg{min-height:100px}.himg .art{width:104px;height:104px}
  .info{padding:10px 14px}.info p{display:none}.info .q2{margin-top:4px}
  .buy{padding:10px 16px 12px;margin-top:8px}
  .herozone{padding-top:10px}
  .dimg{height:240px!important}.dimg+div,#detail>div[style*="height:300px"]{height:240px!important}.dimg .art{width:128px;height:128px}
  .bento{height:128px}.q{margin:16px 16px 10px}.ctile{height:104px}
  .mark{margin-top:28px;width:72px;height:72px}#placed h2{margin-top:14px;font-size:24px}
}
@container (max-height:640px){
  .himg{min-height:84px}.himg .art{width:84px;height:84px}
  .railwrap{height:80px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phonebox"><div class="phone"><div class="screen" id="screen">

    <!-- DAY HOME -->
    <section class="view" id="day" aria-label="Instamart home">
      <div class="scroll-y" style="flex:1;min-height:0">
      <div class="top">
        <div class="status" aria-hidden="true" style="color:var(--d-text)"></div>
        <div class="hdr">
          <div><div class="d-eta">10 mins</div><div class="d-addr"><b>To Home:</b> Sample Layout <span data-ic="chevron-down" data-s="16"></span></div></div>
          <button class="avatar press" style="background:var(--d-text);color:#fff" data-toast="Account isn't part of this prototype" aria-label="Account"><span data-ic="user" data-s="22"></span></button>
        </div>
        <div class="d-search"><button class="bar press" data-toast="Day search isn't part of this prototype"><span>Search for ‘Chips’</span><span data-ic="search" data-s="20" style="color:var(--d-text)"></span></button><button class="bm press" aria-label="Saved" data-toast="Saved items aren't part of this prototype"><span data-ic="bookmark" data-s="22"></span></button></div>
        <button class="banner press" id="banner">
          <span class="bt" id="btag">TONIGHT · 11 PM TO 4 AM</span>
          <h3>Late Hours</h3>
          <p id="bsub">Up late? 30 night picks in 25 mins.</p>
          <span class="cta" id="bcta">Opens in 1 min</span>
        </button>
      </div>
      <div class="tiles" id="dtiles"></div>
      <div class="sec"><b>Bestsellers</b></div>
      <div class="best" id="dbest"></div>
      <div style="height:16px"></div></div>
      <div class="strip"><b>FREE DELIVERY</b> on orders above ₹99</div>
      <nav class="tabs"><button class="on"><span data-ic="house" data-s="24"></span>Home</button><button data-toast="Categories aren't part of this prototype"><span data-ic="layout-grid" data-s="24"></span>Categories</button><button data-toast="Offers aren't part of this prototype"><span data-ic="badge-percent" data-s="24"></span>Upto 70% off</button></nav>
      <div class="dim" id="dim"></div>
    </section>

    <!-- NIGHT HOME -->
    <section class="view" id="nhome" hidden aria-label="Late Hours home">
      <div class="status" aria-hidden="true"></div>
      <div class="nhdr nh"></div>
      <div class="scroll-y" style="flex:1;min-height:0;padding-bottom:4px">
      <div class="bento"><h2>Up late? So are we.</h2><p>A small store, just for tonight.</p><span class="cityslot"></span></div>
      <div class="q">What do you need?</div>
      <div class="cgrid" id="cgrid"></div>
      </div>
      <button class="nsearch press" data-open="search"><span data-ic="search" data-s="20"></span>Search for ‘Maggi’</button>
      <div class="closedov" id="closed1"></div>
    </section>

    <!-- STORE -->
    <section class="view" id="store" hidden aria-label="Late Hours store">
      <div class="status" aria-hidden="true"></div>
      <div class="nhdr nh2"></div>
      <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
      <div class="herozone"><article class="hero" id="hero" aria-live="polite"></article></div>
      <div class="railwrap"><div class="rail" id="rail" tabindex="0" aria-label="Products in this category, swipe to browse"></div></div>
      <div class="hint" id="hint">Swipe the row to see more</div>
      <div class="cbspace" style="flex:none"></div>
      <div class="sk" id="skel" hidden></div>
      <div class="closedov" id="closed2"></div>
    </section>

    <!-- DETAIL -->
    <section class="view" id="detail" hidden aria-label="Product details"></section>

    <!-- CHECKOUT -->
    <section class="view" id="checkout" hidden aria-label="Cart"></section>

    <!-- PLACED -->
    <section class="view" id="placed" hidden aria-label="Order placed"></section>

    <!-- CLOSED AT 4 AM -->
    <section class="view" id="closedv" hidden aria-label="Late Hours closed"></section>

    <!-- A FEW HOURS LATER -->
    <section class="view" id="skip" hidden aria-label="Later that night"><div><small>A few hours later</small><div class="big"><span>11:58 PM</span></div><p>Late Hours closes at 4 AM</p></div></section>

    <!-- DUSK: 11 PM day to night -->
    <div class="view" id="dusk" hidden aria-hidden="true">
      <div class="sky" style="background:linear-gradient(#BFD3FF 0%,#D6E2FF 45%,#F0F0F5 100%);opacity:1"></div>
      <div class="sky" style="background:linear-gradient(#3B4A86 0%,#8A6E9E 45%,#F0A37A 85%,#F6C08E 100%)"></div>
      <div class="sky" style="background:radial-gradient(120% 70% at 70% 15%,#1E2850 0%,#0D1019 60%)"></div>
      <i class="star" style="left:14%;top:12%"></i><i class="star" style="left:30%;top:22%"></i><i class="star" style="left:48%;top:9%"></i><i class="star" style="left:64%;top:18%"></i><i class="star" style="left:80%;top:10%"></i><i class="star" style="left:88%;top:26%"></i><i class="star" style="left:22%;top:34%"></i><i class="star" style="left:56%;top:30%"></i><i class="star" style="left:72%;top:38%"></i><i class="star" style="left:40%;top:40%"></i>

        anim(o,[{transform:'translateY(0)',opacity:1},{transform:`translateY(${up?-14:14}px)`,opacity:0}],{duration:160,easing:E.out,fill:'forwards'}).onfinish=()=>o.remove();

/* Scene changes (11 PM and 4 AM). Seen once a night, so they may take their time.
   One continuous timeline: everything moving uses the same silk ease-in-out, things arriving use a soft ease-out,
   nothing snaps, and the hand-off between scene and screen is a crossfade masked with a 2px blur. */
const SILK='cubic-bezier(0.65,0,0.35,1)',SOFT='cubic-bezier(0.22,1,0.36,1)';
function play(el,kf,o){return anim(el,kf,Object.assign({fill:'both'},o))}
function handoff(scene,screenEl,parts,done){
  // the screen is already underneath; the scene lifts off it
  play(scene,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(2px)'}],{duration:700,easing:SILK}).onfinish=()=>{scene.hidden=true;scene.getAnimations().forEach(a=>a.cancel());scene.querySelectorAll('*').forEach(x=>x.getAnimations().forEach(a=>a.cancel()));done&&done()};
  play(screenEl,[{transform:'scale(1.015)'},{transform:'none'}],{duration:900,easing:SOFT});
  parts.filter(Boolean).forEach((el,i)=>play(el,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:520,easing:SOFT,delay:260+[0,50,90,120,145,165,180,190][Math.min(i,7)]}));
}

  D.hidden=false;
  // 0 to 0.6 s: the day screen settles back as the scene fades in over it
  play(D,[{opacity:0},{opacity:1}],{duration:600,easing:SILK});
  play(day,[{transform:'none',filter:'brightness(1)'},{transform:'scale(.985)',filter:'brightness(.8)'}],{duration:600,easing:SILK});
  // 0.2 to 1.6 s: the sun sets behind the city while the sky turns to dusk, then night
  play(q('.sun'),[{transform:'translateY(0)',opacity:1},{transform:'translateY(170px)',opacity:1,offset:.7},{transform:'translateY(240px)',opacity:0}],{duration:1400,easing:SILK,delay:200});
  play(q('.city'),[{transform:'translateY(28px)'},{transform:'none'}],{duration:1400,easing:SOFT});
  play(duskS,[{opacity:0},{opacity:1}],{duration:1200,easing:SILK,delay:300});
  play(nightS,[{opacity:0},{opacity:1}],{duration:1200,easing:SILK,delay:1100});
  // 1.3 to 2.5 s: the moon rises, stars and windows come on
  play(q('.moon'),[{transform:'translateY(90px) rotate(-20deg)',opacity:0},{transform:'none',opacity:1}],{duration:1100,easing:SOFT,delay:1300});
  qa('.star').forEach((st,i)=>play(st,[{opacity:0,transform:'scale(.6)'},{opacity:.9,transform:'none'}],{duration:700,easing:SOFT,delay:1500+[0,120,60,220,160,300,90,260,190,340][i%10]}));
  qa('.w').forEach((w,i)=>play(w,[{opacity:0},{opacity:1}],{duration:260,easing:'ease',delay:1500+((i*137)%1000)}));
  play(q('.dlabel'),[{opacity:0,transform:'translateY(8px)',filter:'blur(2px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:600,easing:SOFT,delay:1800});
  setTimeout(()=>{
    if(tok!==S.dawnTok)return;
    const n=$('#nhome');n.hidden=false;day.hidden=true;day.getAnimations().forEach(a=>a.cancel());
    S.view='nhome';S.scen='night';$('#homebar').style.background='var(--text)';

    paintScen();
  },2900);

  if(fromTile&&!RM.matches){
    // the tapped tile shrinks into its chip while the store fades in: the store comes from the choice
    const chip=$(`.chip[data-chip="${cat}"]`);chip.scrollIntoView({inline:'center',block:'nearest'});
    const k=K(),sr=screen.getBoundingClientRect(),loc=r=>({left:(r.left-sr.left)/k,top:(r.top-sr.top)/k,width:r.width/k,height:r.height/k}),a=loc(fromTile.getBoundingClientRect()),b=loc(chip.getBoundingClientRect());
    const g=fromTile.cloneNode(true);g.style.cssText=`position:absolute;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;margin:0;z-index:45;transform-origin:0 0;pointer-events:none`;screen.append(g);
    chip.style.opacity=0;
    anim(g,[{transform:'none',borderRadius:'16px',opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${b.height/a.height})`,borderRadius:'60px',opacity:.9}],{duration:450,easing:E.inout}).onfinish=()=>{g.remove();anim(chip,[{opacity:0},{opacity:1}],{duration:120,easing:'ease',fill:'forwards'}).onfinish=()=>chip.style.opacity=''};
    anim(g.querySelector('b'),[{opacity:1},{opacity:0}],{duration:160,easing:'ease',fill:'forwards'});anim(g.querySelector('small'),[{opacity:1},{opacity:0}],{duration:120,easing:'ease',fill:'forwards'});anim(g.querySelector('svg'),[{opacity:1},{opacity:0}],{duration:160,easing:'ease',fill:'forwards'});
    anim(nh,[{opacity:1},{opacity:0}],{duration:260,easing:'ease',fill:'forwards'}).onfinish=()=>{nh.hidden=true;nh.getAnimations().forEach(x=>x.cancel())};
    anim(st,[{opacity:0},{opacity:1}],{duration:300,easing:E.out,delay:120,fill:'backwards'});
    anim($('#hero'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:400,easing:E.out,delay:160,fill:'backwards'});
  }else{nh.hidden=true}
  // first visit shows the real loading state briefly
  if(!S.visitedStore){S.visitedStore=true;const sk=$('#skel');sk.hidden=false;sk.style.opacity=1;sk.innerHTML='<div style="height:36px;width:70%"></div><div style="flex:1;margin-top:12px;border-radius:16px"></div><div style="height:60px;margin:18px auto 0;width:60px;border-radius:50%"></div><div style="height:100px;background:transparent"></div>';sk.style.top=$('#chips').offsetTop+'px';
    setTimeout(()=>{sk.style.opacity=0;setTimeout(()=>sk.hidden=true,260)},650)}
}
function openCheckout(){if(!S.cart.size){toast('Your cart is empty');return}renderCheckout(false);show('checkout','push');soldOutMoment()}
function back(){const to=S.stack.pop()||'store';$('#'+to).hidden=false;if(to==='store'){renderHero(0,true);renderRail(false)}show(to,'pop','checkout');S.paying=false}
function openSearch(){const s=$('#search');s.hidden=false;$('#q').value='';renderSearch();requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('open')));setTimeout(()=>{try{$('#q').focus({preventScroll:true})}catch(e){}},300)}
function closeSearch(){const s=$('#search');s.classList.remove('open');setTimeout(()=>{s.hidden=true;renderCartBar()},320);if(!$('#store').hidden)renderHero(0,true)}

/* ================= events ================= */
screen.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-close]');if(!t)return;const d=t.dataset;
  if(d.toast){toast(d.toast);return}
  if(d.inc){setQty(d.inc,qty(d.inc)+1);return}
  if(d.dec){setQty(d.dec,qty(d.dec)-1);return}
  if(d.notify){if(S.notify.has(d.notify))S.notify.delete(d.notify);else{S.notify.add(d.notify);toast('We’ll tell you when it’s back tomorrow night','bell')}$$(`[data-stp="${d.notify}"]`).forEach(el=>{el.outerHTML=stepper(byId[d.notify],el.classList.contains('sm'))});return}
  if(d.cat){enterStore(d.cat,t);return}
  if(d.chip){setCat(d.chip);return}
  if(d.th!=null){goTo(+d.th);return}
  if(d.nextcat){catLoader(d.nextcat);return}
  if(d.open==='search'){openSearch();return}
  if(d.close==='search'){closeSearch();return}
  if(d.q){$('#q').value=d.q;renderSearch();return}
  if(d.back!=null){back();return}
  if(d.remove){const r=$(`[data-row="${d.remove}"]`);r.classList.add('gone');setTimeout(()=>{S.cart.delete(d.remove);S.added=S.added.filter(x=>x!==d.remove);renderCheckout(true);renderCartBar()},300);return}
  if(d.swap){S.gone.delete('kulfi');S.cart.delete(d.swap);if(!byId.mango){byId.mango={...byId.kulfi,id:'mango',name:'Mango Kulfi Stick',desc:'Alphonso mango, frozen tonight.',night:false,stock:null,c1:'#F2A93B'};A.kulfi2=A.kulfi;}S.cart.set('mango',1);S.added=S.added.filter(x=>x!==d.swap);S.added.push('mango');renderCheckout(true);renderCartBar();toast('Swapped to Mango Kulfi Stick','check');return}
  if(d.remind!=null||t.id==='bcta'){S.remind=!S.remind;renderDay();$$('.closedov').forEach(closedOverlay);if(t.closest('#closedv')){clearTimeout(closeT);$('#closedv .bar i')?.getAnimations().forEach(a=>a.pause());t.textContent=S.remind?'Reminder set for 11 PM':'Remind me at 11 PM';$('#closedv small').textContent='Tap Go to Instamart when you’re ready'}if(S.remind)toast('We’ll remind you at 11 PM','bell');return}
  if(t.id==='banner'){if(S.scen==='closed'){S.remind=!S.remind;renderDay();if(S.remind)toast('We’ll remind you at 11 PM','bell')}else lampDim();return}
  if(t.id==='today'){toDay();return}
  if(t.id==='cartbar'){if(!$('#search').hidden){closeSearch();setTimeout(openCheckout,300)}else openCheckout();return}
  if(t.id==='dpill'){closeDetail();setTimeout(openCheckout,360);return}
  if(t.id==='dclose'){closeDetail();return}
  if(t.id==='done'&&S.closed4){S.cart.clear();S.added=[];S.gone.clear();S.paying=false;closeStore();return}
  if(t.id==='done'){toDay();return}
  if(d.tab!=null){setTab(+d.tab);return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='r'||e.key==='R')&&document.activeElement.tagName!=='INPUT'){setScen('open');return}
  if(e.key==='Escape'){if(!$('#search').hidden)closeSearch();else if(!$('#detail').hidden){$('#detail').hidden=true;detailP=null}else if(!$('#checkout').hidden)back();return}
  if(S.view==='store'&&$('#detail').hidden&&document.activeElement.tagName!=='INPUT'){const n=catList(S.cat).length;if(e.key==='ArrowRight'&&S.idx<n-1)goTo(S.idx+1);if(e.key==='ArrowLeft'&&S.idx>0)goTo(S.idx-1)}
});
new ResizeObserver(()=>{if(!$('#store').hidden)renderRail(true)}).observe($('#rail'));

/* ================= scenarios ================= */
let autoT=0;
function paintScen(){fit();return;$('#scen').innerHTML=SCEN.map(s=>`<button aria-pressed="${s.id===S.scen&&!S.after4}" data-s="${s.id}"><b>${s.t} ${s.ap}</b><span>${s.sub}</span></button>`).join('');$('#jump').hidden=S.scen!=='closing'||S.closed4;fit()}
function setScen(id){
  clearTimeout(autoT);clearInterval(tickT);$('#toasts').innerHTML='';Object.assign(S,{scen:id,cat:'tonight',idx:0,cart:new Map(),added:[],gone:new Set(),notify:new Set(),visitedStore:false,closed4:false,after4:false,dawning:false,dawnTok:(S.dawnTok||0)+1,stack:[],paying:false,dimming:false});soldEventDone=false;lastMsg='';hintHidden=false;$('#hint').style.opacity=1;
  const sc=SCEN.find(s=>s.id===id);S.time=sc.t;$$('.clock').forEach(c=>c.textContent=sc.t);
  VIEWS.forEach(v=>{$('#'+v).hidden=true;$('#'+v).getAnimations().forEach(a=>a.cancel())});$('#search').classList.remove('open');$('#dim').getAnimations().forEach(a=>a.cancel());$$('#dawn *,#dusk *').forEach(x=>x.getAnimations().forEach(a=>a.cancel()));
  if(id==='closed'||id==='open'){renderDay();$('#day').hidden=false;S.view='day';
    if(id==='open')autoT=setTimeout(()=>{if(S.view==='day'&&S.scen==='open')lampDim()},3500)}
  else if(id==='night'){renderNightHome();$('#nhome').hidden=false;S.view='nhome'}
  else{S.cart.set('maggi',1);S.added=['maggi'];renderStore();$('#store').hidden=false;S.view='store';S.visitedStore=true}
  $('#homebar').style.background=S.view==='day'?'var(--d-text)':'var(--text)';
  paintScen();
}
function hit4am(){S.closed4=true;setClock('4:00');
  // someone already paying is never cut off: they finish, then see the closed screen
  if(!$('#checkout').hidden||!$('#placed').hidden){if(!$('#checkout').hidden)renderCheckout(false);toast('It’s 4 AM. We’ll still deliver this order.','circle-check');return}
  closeStore()}
/* 4 AM: Late Hours says goodnight, then the app returns to day mode */
let closeT=0;
function closeStore(){
  clearTimeout(closeT);
  const c=$('#closedv');
  c.innerHTML=`<div class="status" aria-hidden="true" style="position:absolute;top:0;left:0;right:0"></div><div class="cin"><span style="color:var(--fluo)">${ic('moon',48,1)}</span><h2>Late Hours has closed for tonight</h2><p>Thanks for staying up with us.<br>Back at 11 PM.</p><div class="cbtns"><button class="btn" data-remind>${S.remind?'Reminder set for 11 PM':'Remind me at 11 PM'}</button><button class="ghost" id="today">Go to Instamart</button></div><div class="bar"><i></i></div><small>Taking you back to Instamart</small></div>`;
  if(!$('#search').hidden){$('#search').classList.remove('open');$('#search').hidden=true}
  c.hidden=false;S.view='closedv';
  anim(c,[{opacity:0},{opacity:1}],{duration:500,easing:E.out});
  anim(c.querySelector('.cin'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:420,easing:E.out,delay:120,fill:'backwards'});
  setTimeout(()=>{if(S.view==='closedv')VIEWS.forEach(v=>{if(v!=='closedv')$('#'+v).hidden=true})},500);
  // a visible countdown, so the move to day mode is expected, not sudden
  anim(c.querySelector('.bar i'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:4000,easing:'linear',fill:'forwards'});
  closeT=setTimeout(toDay,4000);
}
/* story: after the first order, jump to 3:40 AM so closing time can be seen */
let tickT=0;
function setClock(t){S.time=t;$$('.clock').forEach(c=>c.textContent=t)}
function timeSkip(){
  const k=$('#skip'),big=k.querySelector('.big'),note=k.querySelector('p');
  const hh=+S.time.split(':')[0];big.innerHTML=`<span>${S.time} ${hh>=10&&hh<12?'PM':'AM'}</span>`;
  k.hidden=false;S.view='skip';
  anim(k,[{opacity:0},{opacity:1}],{duration:400,easing:E.out});
  const steps=['1:00 AM','2:00 AM','3:00 AM','3:40 AM'];
  steps.forEach((t,i)=>setTimeout(()=>{const o=big.firstElementChild,n=document.createElement('span');n.textContent=t;big.append(n);
    anim(o,[{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'translateY(-14px)',filter:'blur(2px)'}],{duration:220,easing:E.out,fill:'forwards'}).onfinish=()=>o.remove();
    anim(n,[{opacity:0,transform:'translateY(14px)',filter:'blur(2px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:260,easing:E.out});
  },500+i*380));
  setTimeout(()=>anim(note,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320,easing:E.out,fill:'forwards'}),2100);
  setTimeout(()=>{
    Object.assign(S,{scen:'closing',cart:new Map(),added:[],gone:new Set(),stack:[],paying:false,cat:'tonight',idx:0,visitedStore:true});lastMsg='';
    setClock('3:40');renderNightHome();renderCartBar();
    const n=$('#nhome');n.hidden=false;S.view='nhome';
    VIEWS.forEach(v=>{if(v!=='nhome'&&v!=='skip')$('#'+v).hidden=true});
    anim(k,[{opacity:1},{opacity:0}],{duration:400,easing:'ease',fill:'forwards'}).onfinish=()=>{k.hidden=true;k.getAnimations().forEach(a=>a.cancel());note.getAnimations().forEach(a=>a.cancel())};
    toast('20 mins to last orders. Take your time.','clock');
    startTicker();
  },3300);
}
function startTicker(){
  clearInterval(tickT);
  tickT=setInterval(()=>{
    if(S.scen!=='closing'||S.closed4){clearInterval(tickT);return}
    let[h,m]=S.time.split(':').map(Number);m++;if(m===60){h++;m=0}
    setClock(h+':'+String(m).padStart(2,'0'));
    if(h>=4){clearInterval(tickT);hit4am()}
  },1800);
}
/* after an order: back to the start of the night store */
function goNightHome(){
  S.cart.clear();S.added=[];S.gone.clear();S.paying=false;soldEventDone=false;S.stack=[];S.cat='tonight';S.idx=0;lastMsg='';
  renderNightHome();renderCartBar();
  const n=$('#nhome'),pl=$('#placed');n.hidden=false;S.view='nhome';
  VIEWS.forEach(v=>{if(v!=='nhome'&&v!=='placed')$('#'+v).hidden=true});
  anim(pl,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.98)'}],{duration:220,easing:E.out,fill:'forwards'}).onfinish=()=>{pl.hidden=true;pl.getAnimations().forEach(a=>a.cancel())};
  [...n.querySelectorAll('.ctile')].forEach((t,i)=>anim(t,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:320,easing:E.out,delay:80+[0,35,60,80,95,105][i],fill:'backwards'}));
}
function toDay(){
  clearTimeout(closeT);if((S.view!=='closedv'&&S.view!=='placed')||S.dawning)return;clearInterval(tickT);S.dawning=true;S.dawnTok=(S.dawnTok||0)+1;const tok0=S.dawnTok;
  Object.assign(S,{scen:'closed',after4:true,cart:new Map(),added:[],gone:new Set(),stack:[],paying:false});
  renderDay();
  const d=$('#day'),c=$('#'+S.view),dawn=$('#dawn');
  const [,early,dayS]=dawn.querySelectorAll('.sky'),moon=dawn.querySelector('.moon'),sun=dawn.querySelector('.sun'),lbl=dawn.querySelector('.dlabel');
  // the goodbye copy leaves first, quickly
  play(c.querySelector('.cin')||c,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-6px)'}],{duration:300,easing:SOFT});
  // the scene's night sky is the closed screen's colour, so it appears without a seam
  dawn.hidden=false;
  play(dawn,[{opacity:0},{opacity:1}],{duration:400,easing:SILK,delay:150});
  play(moon,[{transform:'none',opacity:1},{transform:'translateY(90px)',opacity:0}],{duration:1200,easing:SILK,delay:300});
  play(early,[{opacity:0},{opacity:1}],{duration:1200,easing:SILK,delay:500});
  play(sun,[{transform:'translateY(170px) scale(.92)',opacity:0},{transform:'none',opacity:1}],{duration:1500,easing:SILK,delay:700});
  play(dayS,[{opacity:0},{opacity:1}],{duration:1100,easing:SILK,delay:1400});
  play(lbl,[{opacity:0,transform:'translateY(8px)',filter:'blur(2px)',color:'#ffffff'},{opacity:1,transform:'none',filter:'blur(0)',color:'#ffffff',offset:.5},{opacity:1,transform:'none',filter:'blur(0)',color:'#002E98'}],{duration:1500,easing:SILK,delay:1100});
  setTimeout(()=>{if(tok0!==S.dawnTok)return;
    c.hidden=true;c.getAnimations().forEach(a=>a.cancel());c.querySelector('.cin')?.getAnimations().forEach(a=>a.cancel());$('#placed').hidden=true;
    VIEWS.forEach(v=>{if(v!=='day'&&v!=='dawn')$('#'+v).hidden=true});
    d.hidden=false;S.view='day';$('#homebar').style.background='var(--d-text)';$('#cartbar').classList.remove('show');
    setClock('4:01');
    handoff(dawn,d,[d.querySelector('.hdr'),d.querySelector('.d-search'),d.querySelector('#banner'),d.querySelector('#dtiles')],()=>{S.dawning=false});
    paintScen();
  },2700);
}
new MutationObserver(()=>{if(!cbRAF)cbRAF=requestAnimationFrame(()=>{cbRAF=0;renderCartBar()})}).observe($('#screen'),{subtree:true,attributes:true,attributeFilter:['hidden']});
let cbRAF=0;
paintIcons(document);
setScen('open');fit();document.fonts?.ready.then(fit);
}
</script>
